name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and native build deps (Linux)
        if: runner.os == 'Linux'
        # gfortran is needed to build vcpkg's reference BLAS/LAPACK ports,
        # which faiss depends on; pkg-config is needed to locate poppler-cpp.
        # autoconf/autoconf-archive/automake/libtool are needed to build
        # gperf from source via vcpkg -- a build-time tool for fontconfig,
        # which poppler pulls in by default (font-configuration feature).
        # Without these, vcpkg fails with an explicit "gperf currently
        # requires the following programs from the system package manager"
        # error before ever reaching this project's own CMakeLists.txt.
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config gfortran autoconf autoconf-archive automake libtool

      - name: Install Ninja and native build deps (macOS)
        if: runner.os == 'macOS'
        # See the Linux step above for why autoconf/autoconf-archive/automake/libtool are needed.
        # libomp is needed because AppleClang doesn't support OpenMP out of
        # the box, and faiss's vcpkg port requires it -- see
        # triplets/arm64-osx.cmake and this project's own CMakeLists.txt for
        # the two-sided fix that wires it in (vcpkg's port build, and this
        # project's own find_package(faiss ...), respectively).
        run: brew install ninja pkg-config autoconf autoconf-archive automake libtool libomp

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            build/vcpkg_installed
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git
          fi
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset default

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
